title: SSH - failure base (for correlation)
name: ssh_failed_login
id: 10000000-0000-0000-0000-000000000006
status: experimental
description: Base rule; used by the correlation below.
author: ejemplo-loganalyzer
level: informational
logsource:
  product: linux
  service: auth
detection:
  sel:
    - 'Failed password'
    - 'authentication failure'
  condition: sel
---
title: SSH - Brute force (>=5 failures in 5 min per IP)
id: 10000000-0000-0000-0000-000000000007
status: experimental
description: event_count correlation over the base rule, grouped by source IP.
author: ejemplo-loganalyzer
level: high
tags:
  - attack.credential_access
  - attack.t1110
correlation:
  type: event_count
  rules:
    - ssh_failed_login
  group-by:
    - src_ip
  timespan: 5m
  condition:
    gte: 5
